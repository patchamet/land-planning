<svg width="680" height="650" viewBox="0 0 680 650" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <!-- Wiring diagram: ESP32 + 2ch relay + LED load (desk prototype, no AC mains) -->
  <rect x="0" y="0" width="680" height="650" fill="#ffffff"/>
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ผังการต่อสาย — Switch Control (ชุดโต๊ะทดลอง)</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <!-- Computer -->
  <rect x="60" y="50" width="180" height="44" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="150" y="77" text-anchor="middle" font-size="14" font-weight="bold" fill="#444441">คอม + สาย USB Type-C</text>
  <line x1="150" y1="94" x2="150" y2="134" stroke="#5F5E5A" stroke-width="2" marker-end="url(#ah)"/>
  <text x="160" y="118" font-size="12" fill="#5F5E5A">จ่ายไฟ + flash โค้ด</text>

  <!-- ESP32 -->
  <rect x="60" y="140" width="180" height="250" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="150" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">ESP32 DevKit</text>
  <text x="228" y="214" text-anchor="end" font-size="12" fill="#993C1D">VIN (5V)</text>
  <text x="228" y="254" text-anchor="end" font-size="12" fill="#993C1D">GND</text>
  <text x="228" y="294" text-anchor="end" font-size="12" fill="#993C1D">GPIO26</text>
  <text x="228" y="324" text-anchor="end" font-size="12" fill="#993C1D">GPIO27</text>
  <text x="110" y="376" text-anchor="middle" font-size="12" fill="#993C1D">GND</text>
  <text x="150" y="376" text-anchor="middle" font-size="12" fill="#993C1D">3V3</text>

  <!-- Relay -->
  <rect x="420" y="140" width="200" height="250" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="520" y="168" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Relay 2 ช่อง</text>
  <text x="428" y="214" font-size="12" fill="#0F6E56">VCC</text>
  <text x="428" y="254" font-size="12" fill="#0F6E56">GND</text>
  <text x="428" y="294" font-size="12" fill="#0F6E56">IN1</text>
  <text x="428" y="324" font-size="12" fill="#0F6E56">IN2</text>
  <text x="470" y="376" text-anchor="middle" font-size="12" fill="#0F6E56">COM1</text>
  <text x="570" y="376" text-anchor="middle" font-size="12" fill="#0F6E56">NO1</text>

  <!-- Power + signal wires ESP32 -> Relay -->
  <line x1="240" y1="210" x2="420" y2="210" stroke="#E24B4A" stroke-width="2"/>
  <text x="330" y="202" text-anchor="middle" font-size="12" fill="#A32D2D">5V: VIN → VCC</text>
  <line x1="240" y1="250" x2="420" y2="250" stroke="#888780" stroke-width="2"/>
  <text x="330" y="242" text-anchor="middle" font-size="12" fill="#5F5E5A">GND → GND</text>
  <line x1="240" y1="290" x2="420" y2="290" stroke="#378ADD" stroke-width="2"/>
  <text x="330" y="282" text-anchor="middle" font-size="12" fill="#185FA5">GPIO26 → IN1 (ch1)</text>
  <line x1="240" y1="320" x2="420" y2="320" stroke="#378ADD" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="330" y="342" text-anchor="middle" font-size="12" fill="#185FA5">GPIO27 → IN2 (เผื่อ ch2)</text>

  <!-- Load loop: 3V3 -> COM1, NO1 -> R -> LED -> GND -->
  <path d="M150,390 L150,470 L470,470 L470,390" fill="none" stroke="#BA7517" stroke-width="2"/>
  <text x="310" y="462" text-anchor="middle" font-size="12" fill="#854F0B">3V3 → COM1 (ไฟเข้าสวิตช์)</text>
  <path d="M570,390 L570,530 L510,530" fill="none" stroke="#BA7517" stroke-width="2"/>
  <text x="582" y="465" font-size="12" fill="#854F0B">ออก NO1</text>
  <rect x="440" y="515" width="70" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="475" y="535" text-anchor="middle" font-size="12" fill="#444441">R 220Ω</text>
  <line x1="440" y1="530" x2="357" y2="530" stroke="#BA7517" stroke-width="2"/>
  <circle cx="345" cy="530" r="12" fill="#FAC775" stroke="#854F0B" stroke-width="1.5"/>
  <text x="345" y="560" text-anchor="middle" font-size="12" fill="#854F0B">LED</text>
  <path d="M333,530 L110,530 L110,390" fill="none" stroke="#888780" stroke-width="2"/>
  <text x="222" y="522" text-anchor="middle" font-size="12" fill="#5F5E5A">ขา − กลับ GND</text>

  <!-- Pin dots -->
  <g fill="#5F5E5A">
    <circle cx="240" cy="210" r="4"/><circle cx="240" cy="250" r="4"/><circle cx="240" cy="290" r="4"/><circle cx="240" cy="320" r="4"/>
    <circle cx="150" cy="390" r="4"/><circle cx="110" cy="390" r="4"/>
    <circle cx="420" cy="210" r="4"/><circle cx="420" cy="250" r="4"/><circle cx="420" cy="290" r="4"/><circle cx="420" cy="320" r="4"/>
    <circle cx="470" cy="390" r="4"/><circle cx="570" cy="390" r="4"/>
  </g>

  <!-- Legend -->
  <line x1="60" y1="600" x2="90" y2="600" stroke="#E24B4A" stroke-width="2"/>
  <text x="96" y="604" font-size="12" fill="#5F5E5A">ไฟเลี้ยง 5V</text>
  <line x1="190" y1="600" x2="220" y2="600" stroke="#888780" stroke-width="2"/>
  <text x="226" y="604" font-size="12" fill="#5F5E5A">GND</text>
  <line x1="290" y1="600" x2="320" y2="600" stroke="#378ADD" stroke-width="2"/>
  <text x="326" y="604" font-size="12" fill="#5F5E5A">สัญญาณสั่งงาน</text>
  <line x1="440" y1="600" x2="470" y2="600" stroke="#BA7517" stroke-width="2"/>
  <text x="476" y="604" font-size="12" fill="#5F5E5A">วงจรโหลด LED</text>
  <text x="60" y="632" font-size="12" fill="#A32D2D">⚠ ใช้ขั้ว NO (normally open) — หลอดดับเป็นค่าเริ่มต้น / relay ส่วนใหญ่ active-low: สั่ง LOW = ติด</text>
</svg>
